name: Build & Package AppOpt-RS

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: '版本后缀（留空则用 git hash）'
        required: false
        default: ''

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: r27c

jobs:
  build:
    name: Build (${{ matrix.arch_dir }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            arch_dir: arm64-v8a
            linker: aarch64-linux-android26-clang
          - target: x86_64-linux-android
            arch_dir: x86_64
            linker: x86_64-linux-android26-clang
          - target: i686-linux-android
            arch_dir: x86
            linker: i686-linux-android26-clang

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Configure Cargo for cross-compilation
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          TOOLCHAIN="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"

          mkdir -p .cargo
          cat > .cargo/config.toml << TOMLEOF
          [target.${{ matrix.target }}]
          linker = "${TOOLCHAIN}/${{ matrix.linker }}"
          TOMLEOF

          echo "Toolchain path: ${TOOLCHAIN}"
          ls "${TOOLCHAIN}" | grep "${{ matrix.linker }}" || echo "linker not found, listing clang binaries:"
          ls "${TOOLCHAIN}" | grep clang | head -10

      - name: Build release binary
        run: |
          cargo build \
            --release \
            --target ${{ matrix.target }}

      - name: Strip binary
        run: |
          NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          LLVM_STRIP="${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          BINARY="target/${{ matrix.target }}/release/appopt"
          if [ -f "${BINARY}" ]; then
            "${LLVM_STRIP}" "${BINARY}" || true
            ls -lh "${BINARY}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: appopt-${{ matrix.arch_dir }}
          path: target/${{ matrix.target }}/release/appopt
          retention-days: 7

  package:
    name: Package Magisk Module
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [ -n "${{ github.event.inputs.version_suffix }}" ]; then
            VERSION="${{ github.event.inputs.version_suffix }}"
          else
            SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
            VERSION="dev-${SHORT_SHA}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Build Magisk module zip
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          MODULE_ID="AppOpt_RS"
          MODDIR="module_build"

          mkdir -p "${MODDIR}/META-INF/com/google/android"
          mkdir -p "${MODDIR}/bin/arm64-v8a"
          mkdir -p "${MODDIR}/bin/x86_64"
          mkdir -p "${MODDIR}/bin/x86"

          # 复制编译好的二进制
          cp artifacts/appopt-arm64-v8a/appopt   "${MODDIR}/bin/arm64-v8a/appopt"   || echo "WARN: arm64 binary missing"
          cp artifacts/appopt-x86_64/appopt      "${MODDIR}/bin/x86_64/appopt"      || echo "WARN: x86_64 binary missing"
          cp artifacts/appopt-x86/appopt         "${MODDIR}/bin/x86/appopt"         || echo "WARN: x86 binary missing"
          chmod +x "${MODDIR}"/bin/*/appopt 2>/dev/null || true

          # ---------- module.prop ----------
          cat > "${MODDIR}/module.prop" << PROPEOF
          id=${MODULE_ID}
          name=AppOpt-RS（智能线程优化）
          version=v${VERSION}
          versionCode=$(echo "${VERSION}" | tr -cd '0-9' | head -c6)
          author=AppOpt-RS Contributors
          description=智能线程绑核优化，自动识别CPU拓扑与线程角色，无需配置文件。基于 Rust 编写。
          PROPEOF

          # ---------- updater-script ----------
          echo "#MAGISK" > "${MODDIR}/META-INF/com/google/android/updater-script"

          # ---------- update-binary ----------
          cat > "${MODDIR}/META-INF/com/google/android/update-binary" << 'UBEOF'
          #!/sbin/sh
          umask 022
          SKIPUNZIP=1

          ui_print() { echo "$1"; }

          require_new_magisk() {
            ui_print "*******************************"
            ui_print " Please install Magisk v20.4+!"
            ui_print "*******************************"
            exit 1
          }

          if [ ! -f /data/adb/magisk/util_functions.sh ]; then
            require_new_magisk
          fi
          . /data/adb/magisk/util_functions.sh
          [ "$MAGISK_VER_CODE" -lt 20400 ] && require_new_magisk

          ui_print "- 解压模块文件..."
          unzip -o "$ZIPFILE" -x 'META-INF/*' -d "$MODPATH"

          ABI=$(getprop ro.product.cpu.abi)
          ui_print "- 设备 ABI: ${ABI}"

          if   echo "$ABI" | grep -q "arm64";   then ARCH_DIR="arm64-v8a"
          elif echo "$ABI" | grep -q "x86_64";  then ARCH_DIR="x86_64"
          elif echo "$ABI" | grep -q "x86";     then ARCH_DIR="x86"
          else ARCH_DIR="armeabi-v7a"
          fi
          ui_print "- 架构: ${ARCH_DIR}"

          if [ -f "${MODPATH}/bin/${ARCH_DIR}/appopt" ]; then
            cp "${MODPATH}/bin/${ARCH_DIR}/appopt" "${MODPATH}/appopt"
            chmod 755 "${MODPATH}/appopt"
            ui_print "- 二进制安装成功"
          else
            abort "! 未找到 ${ARCH_DIR} 架构的二进制，安装失败"
          fi

          rm -rf "${MODPATH}/bin"

          set_perm_recursive "$MODPATH" root root 0755 0644
          set_perm "${MODPATH}/appopt"     root root 0755
          set_perm "${MODPATH}/service.sh" root root 0755

          ui_print "- AppOpt-RS 安装完成，重启后生效"
          UBEOF
          chmod +x "${MODDIR}/META-INF/com/google/android/update-binary"

          # ---------- service.sh ----------
          cat > "${MODDIR}/service.sh" << 'SVCEOF'
          #!/system/bin/sh
          # 等待系统启动
          i=12
          until [ "$(getprop sys.boot_completed)" = "1" ] || [ $i -le 0 ]; do
            i=$((i - 1)); sleep 10
          done

          MODULE_DIR="${0%/*}"
          BINARY="${MODULE_DIR}/appopt"
          LOG_FILE="${MODULE_DIR}/appopt.log"
          CONFIG_FILE="${MODULE_DIR}/custom.toml"

          killall -15 appopt 2>/dev/null
          sleep 1

          [ ! -f "${BINARY}" ] && echo "[$(date)] ERROR: binary not found" >> "${LOG_FILE}" && exit 1
          chmod 755 "${BINARY}"
          : > "${LOG_FILE}"

          ARGS=""
          [ -f "${CONFIG_FILE}" ] && ARGS="-c ${CONFIG_FILE}"

          nohup "${BINARY}" ${ARGS} >> "${LOG_FILE}" 2>&1 &
          echo "[$(date)] AppOpt-RS started PID=$!" >> "${LOG_FILE}"
          SVCEOF
          chmod +x "${MODDIR}/service.sh"

          # ---------- uninstall.sh ----------
          printf '#!/system/bin/sh\nkillall -15 appopt 2>/dev/null\n' > "${MODDIR}/uninstall.sh"
          chmod +x "${MODDIR}/uninstall.sh"

          # ---------- customize.sh ----------
          cat > "${MODDIR}/customize.sh" << 'CUSEOF'
          ui_print "**************************************************"
          ui_print "  AppOpt-RS - 智能线程绑核优化"
          ui_print "**************************************************"
          [ ! -f "/sys/devices/system/cpu/present" ] && abort "! 无法读取 CPU 信息"
          ui_print "- CPU 核心: $(cat /sys/devices/system/cpu/present)"
          for i in 0 1 2 3 4 5 6 7; do
            FREQ_PATH="/sys/devices/system/cpu/cpu${i}/cpufreq/cpuinfo_max_freq"
            [ -f "${FREQ_PATH}" ] && ui_print "  CPU${i}: $(($(cat ${FREQ_PATH}) / 1000)) MHz"
          done
          ui_print "- 重启后生效"
          CUSEOF

          # ---------- custom.toml.example ----------
          cat > "${MODDIR}/custom.toml.example" << 'CFGEOF'
          # AppOpt-RS 用户覆盖配置（可选）
          # 重命名为 custom.toml 后生效，不存在则完全使用内置规则

          # [settings]
          # scan_interval_ms = 2000
          # log_level = "info"   # debug / info

          # [override]
          # "RenderThread" = "prime"
          # "MyCustomThread" = "big"

          # [override_app."com.example.game"]
          # "GameMainThread" = "prime"
          CFGEOF

          # ---------- 打包 ----------
          ZIP_NAME="AppOpt-RS-v${VERSION}.zip"
          cd "${MODDIR}"
          zip -r9 "../${ZIP_NAME}" . -x "*.DS_Store"
          cd ..
          ls -lh "${ZIP_NAME}"
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      - name: Upload module zip
        uses: actions/upload-artifact@v4
        with:
          name: AppOpt-RS-module-${{ steps.version.outputs.version }}
          path: AppOpt-RS-v*.zip
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AppOpt-RS-v*.zip
          generate_release_notes: true
          body: |
            ## AppOpt-RS ${{ steps.version.outputs.version }}

            ### 功能
            - 自动识别 CPU 拓扑（Prime / Big / Little）
            - 自动识别线程角色（Unity / Unreal / Flutter / Chromium / 原生）
            - 智能绑核，无需配置文件
            - 可选 `custom.toml` 覆盖特定规则

            ### 安装
            通过 Magisk / KernelSU / APatch 刷入 zip 包，重启生效

            ### 支持架构
            - `arm64-v8a`（主流旗舰）
            - `armeabi-v7a`（32位）
            - `x86_64` / `x86`（模拟器）
